# Name-based PHP routing (Windows php-cgi FastCGI stand-in for php-fpm).
#
# AllowOverride All → project .htaccess enabled (same as XAMPP).
# CodeIgniter XAMPP rules use index.php/PATH_INFO; php-cgi needs a
# VirtualHost rewrite to index.php?/PATH (stack-level only — no project edits).

ProxyRequests Off
ProxyPreserveHost On
HttpProtocolOptions Unsafe

# localhost / latest — DEFAULT PHP (managed by Stack Panel)
<VirtualHost *:80>
    ServerName localhost
    ServerAlias latest localhost.latest
    DocumentRoot "C:/web/htdocs"

    RewriteEngine On
    # After .htaccess rewrites to /app/index.php/controller → query form for php-cgi
    RewriteRule ^/(.*\.php)/(.*)$ /$1?/$2 [NE,L,QSA]

    <Directory "C:/web/htdocs">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php index.html
        AcceptPathInfo On
        <FilesMatch "\.php$">
            SetHandler "proxy:fcgi://127.0.0.1:9080/"
        </FilesMatch>
    </Directory>
    ProxyFCGISetEnvIf "true" SCRIPT_FILENAME "C:/web/htdocs%{reqenv:SCRIPT_NAME}"
    ErrorLog "logs/php-default-error.log"
    CustomLog "logs/php-default-access.log" "%h %l %u %t \"%r\" %>s %b \"%{Host}i\""
</VirtualHost>

