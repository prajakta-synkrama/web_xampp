    ProxyFCGISetEnvIf "true" SCRIPT_FILENAME "C:/web/htdocs%{reqenv:SCRIPT_NAME}"
    ErrorLog "logs/php74-error.log"
    CustomLog "logs/php74-access.log" "%h %l %u %t \"%r\" %>s %b \"%{Host}i\""
</VirtualHost>

