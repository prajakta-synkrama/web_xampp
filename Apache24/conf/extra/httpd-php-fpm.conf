# Name-based PHP routing (Windows php-cgi FastCGI stand-in for php-fpm).
#
#   Default (localhost / latest)  ->  port from panel setting (default 9084 / PHP 8.4)
#   PHP 7.4  ->  php7  localhost7  localhost.php7           :9074
#   PHP 8.0  ->  php8  localhost8  localhost.php8           :9080
#   PHP 8.4  ->  php8.4  localhost84  localhost.php84       :9084
#
# Start listeners first: C:/web/start-php.bat
# Trailing slash on fcgi URLs is required on Windows.
# Panel setting default_php controls the localhost VirtualHost port below.

ProxyRequests Off
ProxyPreserveHost On

# Allow Host names like php8.4 (numeric final label).
HttpProtocolOptions Unsafe

# localhost / latest — DEFAULT PHP (managed by Stack Panel)
<VirtualHost *:80>
    ServerName localhost
    ServerAlias latest localhost.latest
    DocumentRoot "C:/web/htdocs"
    <Directory "C:/web/htdocs">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php index.html
        <FilesMatch "\.php$">
            SetHandler "proxy:fcgi://127.0.0.1:9080/"
        </FilesMatch>
    </Directory>
    ProxyFCGISetEnvIf "true" SCRIPT_FILENAME "C:/web/htdocs%{reqenv:SCRIPT_NAME}"
    ErrorLog "logs/php-default-error.log"
    CustomLog "logs/php-default-access.log" "%h %l %u %t \"%r\" %>s %b \"%{Host}i\""
</VirtualHost>

# PHP 7.4
<VirtualHost *:80>
    ServerName php7
    ServerAlias localhost7 localhost.php7
    DocumentRoot "C:/web/htdocs"
    <Directory "C:/web/htdocs">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php index.html
        <FilesMatch "\.php$">
            SetHandler "proxy:fcgi://127.0.0.1:9074/"
